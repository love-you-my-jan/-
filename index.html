<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Shanta ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-image: radial-gradient(circle, #fbc2eb 0%, #a6c1ee 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        /* Heart Animation */
        .heart-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            animation: heartbeat 1.5s infinite;
        }

        .heart {
            background-color: #ff3860;
            display: inline-block;
            width: 150px;
            height: 150px;
            position: relative;
            transform: rotate(-45deg);
            box-shadow: 0 10px 20px rgba(255, 56, 96, 0.4);
        }

        .heart::before,
        .heart::after {
            content: "";
            background-color: #ff3860;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before { top: -75px; left: 0; }
        .heart::after { top: 0; left: 75px; }

        .name-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            color: white;
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            z-index: 10;
            width: 100%;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Main Card */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 450px;
            transition: transform 0.3s;
        }

        h1 {
            color: #d63384;
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-family: 'Dancing Script', cursive;
        }

        /* Buttons */
        .btn-grp {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .yes-btn {
            background: #28a745;
            color: white;
        }

        .yes-btn:hover {
            background: #218838;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4);
        }

        .no-btn {
            background: #dc3545;
            color: white;
        }

        .no-btn:hover {
            background: #c82333;
        }

        /* Result Screen */
        .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s;
        }

        .screenshot-msg {
            background: #fff;
            color: #d63384;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px dashed #d63384;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall 3s linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

    </style>
</head>
<body>

    <!-- Proposal Section -->
    <div class="card" id="proposalCard">
        <div class="heart-container">
            <div class="heart">
                <div class="name-text">Shanta</div>
            </div>
        </div>
        
        <h1 id="question">শান্তা, তুমি কি আমার হবে? ❤️</h1>
        
        <div class="btn-grp">
            <button class="yes-btn" id="yesBtn" onclick="acceptLove()">YES 🥰</button>
            <button class="no-btn" id="noBtn" onclick="makeExcuses()">NO 😢</button>
        </div>
    </div>

    <!-- Success Section -->
    <div class="result-screen" id="successScreen">
        <div class="heart-container">
            <div class="heart" style="background-color: #ff3860;">
                <div class="name-text" style="font-size: 2rem;">Love U</div>
            </div>
        </div>
        <h1>Yeeey! I knew it! 🎉</h1>
        
        <div class="screenshot-msg">
            📸 Take a Screenshot now <br> 
            and send it to me!
        </div>
    </div>

    <script>
        // Bahana List (Excuses)
        const excuses = [
            "Are you sure?",
            "প্লিজ না বলো না 😢",
            "ভেবে দেখো একবার!",
            "আমার হার্ট ভেঙে যাবে 💔",
            "এত নিষ্ঠুর হইও না!",
            "আমি কান্না করব কিন্তু 😭",
            "Please Shanta...",
            "Don't do this!",
            "আর একবার সুযোগ দাও",
            "আমি তোমাকে অনেক ভালোবাসি",
            "না বলা যাবে না!",
            "হাতটা ধরো প্লিজ",
            "লক্ষ্মীটি ইয়েস বলো",
            "Change your mind!",
            "Really??",
            "Is that your final answer?",
            "You are breaking my heart",
            "Just say YES! ❤️",
            "No button কাজ করবে না 😜"
        ];

        let index = 0;
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const proposalCard = document.getElementById('proposalCard');
        const successScreen = document.getElementById('successScreen');
        const question = document.getElementById('question');

        function makeExcuses() {
            // Change No Button Text
            noBtn.innerText = excuses[index];
            index = (index + 1) % excuses.length;

            // Increase Yes Button Size slightly to pressure :)
            let currentSize = parseFloat(window.getComputedStyle(yesBtn).fontSize);
            yesBtn.style.fontSize = (currentSize + 5) + 'px';
            yesBtn.style.padding = '15px 40px';
            
            // Funny interaction: Move No button slightly to make it annoying
            const randomX = Math.random() * 50 - 25;
            const randomY = Math.random() * 50 - 25;
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;

            // Update Header Text occasionally
            if (index % 3 === 0) {
                question.innerText = "Please মানা করো না... 🥺";
            }
        }

        function acceptLove() {
            // Hide Proposal Card
            proposalCard.style.display = 'none';
            
            // Show Success Screen
            successScreen.style.display = 'flex';
            
            // Start Confetti
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            
            for (let i = 0; i < 100; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animationDuration = Math.random() * 2 + 3 + 's';
                document.body.appendChild(conf);
            }
        }

    </script>
</body>
</html>
